[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dms-sentinel"
version = "0.6.0"
description = "Local driver monitoring demonstration with optional Gemini assistance"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3", "aiosqlite>=0.20,<1", "httpx>=0.27,<1",
  "numpy>=1.26,<3", "opencv-contrib-python>=4.10,<5", "mediapipe>=0.10.20,<0.11",
]

[project.optional-dependencies]
gemini = ["google-genai>=2,<3"]
voice = ["faster-whisper>=1.1,<2", "sounddevice>=0.5,<1"]
knowledge = ["sentence-transformers>=3,<6", "chromadb>=1,<2", "rank-bm25>=0.2,<1"]

[project.scripts]
sentinel = "main_v5:cli"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "mypy>=1.13,<2", "playwright>=1.49,<2"]

[tool.setuptools]
py-modules = ["main_v5"]

[tool.setuptools.packages.find]
include = ["ai*", "core*", "perception*", "agents*", "alerts*", "memory*", "rag*", "voice*", "ui*"]
namespaces = true

[tool.setuptools.package-data]
"ui.web" = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
include = ["core/*.py", "agents/safety_agent.py", "alerts/alert_engine_v5.py", "perception/pipeline.py", "perception/fatigue_engine_v5.py", "memory/store.py", "rag/knowledge.py", "ai/assistant.py", "voice/local.py", "ui/web/server.py", "main_v5.py", "tests/*.py", "scripts/*.py"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
ignore_missing_imports = true
files = ["core/contracts.py", "core/config.py", "agents/safety_agent.py"]
